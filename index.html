  <style>:root { color-scheme: light dark; --bg: #faf9f7; --fg: #24222b; --muted: #68646f; --line: #dcd9d3; --accent: #5b4b8a; }
@media (prefers-color-scheme: dark) { :root { --bg: #17151c; --fg: #e9e6ef; --muted: #a29eac; --line: #38343f; --accent: #b6a6e6; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.8; overflow-wrap: anywhere; }
header, main, footer { max-width: 44rem; margin: 0 auto; padding: 0 16px; }
header { padding-top: 24px; }
.site-name { color: var(--fg); font-weight: 600; letter-spacing: .08em; text-decoration: none; }
main { padding-top: 16px; padding-bottom: 32px; }
h1 { font-size: 1.6rem; line-height: 1.4; }
h2 { font-size: 1.25rem; line-height: 1.5; margin-top: 2.5rem; }
h3, h4 { font-size: 1.05rem; line-height: 1.5; margin-top: 1.75rem; }
a { color: var(--accent); }
hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
table { display: block; width: 100%; overflow-x: auto; border-collapse: collapse; margin: 1rem 0; }
th, td { border: 1px solid var(--line); padding: .5rem .75rem; text-align: left; vertical-align: top; min-width: 7rem; }
blockquote { margin: 1rem 0; padding: .25rem 1rem; border-left: 3px solid var(--line); color: var(--muted); }
footer { padding-top: 16px; padding-bottom: 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
footer ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; }
</style>
